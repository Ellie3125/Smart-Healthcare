# Bảng định tuyến đường tắt (Giải pháp kỹ thuật §11.3.5, contract docs/api/chatbot.md §6): câu khớp ở đây đi thẳng tới intent,
# không gọi model (dưới khoảng 1 giây, chạy được cả khi model tạm ngưng). Câu không khớp mới cần model.
# Sửa hành vi chatbot bằng cách sửa bảng này rồi chạy lại bộ kịch bản; không viết cứng trong code, không huấn luyện model.
# Quy ước so khớp như config/specialty_hints.yaml (có dấu so với có dấu; không dấu so với đã bỏ dấu; nguyên từ).
version: "2026-11-18"

# Hỏi tư vấn chuyên môn: chẩn đoán, thuốc, kê đơn, chỉ định xét nghiệm. Chatbot từ chối (Phạm vi §2.2). Kiểm sau dấu hiệu nguy hiểm.
medical_advice:
  - uống thuốc gì
  - thuốc gì
  - nên uống gì
  - kê đơn
  - kê thuốc
  - liều thuốc
  - liều dùng
  - chẩn đoán
  - tôi bị bệnh gì
  - bị bệnh gì
  - có phải bị
  - có nguy hiểm không
  - cần xét nghiệm gì
  - nên làm xét nghiệm
  - chữa thế nào
  - điều trị thế nào

help:
  - xin chào
  - chào bạn
  - chào bot
  - bạn làm được gì
  - bạn giúp được gì
  - hướng dẫn
  - trợ giúp

# Intent → cụm từ. Thứ tự là thứ tự ưu tiên khi một câu khớp nhiều intent.
intents:
  SUGGEST_SPECIALTY: [khám khoa nào, khoa nào, chuyên khoa nào, nên khám ở đâu, nên khám gì]
  # Đứng trước VIEW_APPOINTMENTS: "xem lịch sử khám" chứa "xem lịch".
  VIEW_VISIT_HISTORY: [lịch sử khám, lần khám trước, lần khám gần nhất, các lần khám, những lần khám, khám lần trước, đã khám những gì, hồ sơ khám, bệnh án]
  CANCEL: [hủy lịch, huỷ lịch, hủy hẹn, huỷ hẹn, hủy cái hẹn, huỷ cái hẹn, bỏ lịch, bỏ hẹn, bỏ cái hẹn, không đi khám nữa]
  RESCHEDULE: [đổi lịch, dời lịch, chuyển lịch, đổi ngày khám, đổi bác sĩ, dời buổi khám, dời ngày khám, dời giúp, hoãn lịch, sang hôm khác]
  VIEW_TICKET: [xem vé, vé khám, số thứ tự, mã lịch hẹn, mã đặt lịch, mã để đi khám, mã đi khám, mã khám]
  VIEW_EXAM_PAYMENT: [thanh toán chưa, đã thanh toán, trạng thái thanh toán, tiền khám, phí khám đã trả, hoàn tiền]
  VIEW_APPOINTMENTS: [lịch của tôi, lịch khám của tôi, lịch hẹn của tôi, lịch của mình, xem lịch, lịch đã đặt, lịch đã hẹn, các cuộc hẹn]
  SEARCH_SLOTS: [đặt lịch, đặt khám, tìm bác sĩ, tìm lịch, lịch trống, còn suất, còn chỗ]

templates:
  emergency: >-
    Các dấu hiệu bạn mô tả có thể nguy hiểm. Vui lòng đến cơ sở cấp cứu gần nhất hoặc gọi 115 ngay, không chờ đặt lịch khám.
  medical_advice: >-
    Mình không thể tư vấn chẩn đoán, thuốc hay chỉ định xét nghiệm; việc này cần bác sĩ đánh giá khi khám.
    Mình có thể gợi ý chuyên khoa để bạn đặt lịch, hoặc giúp tìm lịch khám.
  help: >-
    Mình giúp được: tìm và đặt lịch khám, xem, đổi hoặc hủy lịch, xem vé, xem trạng thái thanh toán phí khám,
    xem tóm tắt các lần khám trước, và gợi ý chuyên khoa tham khảo khi bạn chưa biết nên khám khoa nào.
  specialty_ask: >-
    Bạn mô tả giúp mình triệu chứng hoặc vị trí khó chịu (ví dụ: đau bụng trên mấy hôm nay), mình sẽ gợi ý chuyên khoa tham khảo.
  specialty_match: "Theo mô tả của bạn, bạn có thể tham khảo: {names}."
  specialty_fallback: "Mình chưa xác định được chuyên khoa phù hợp từ mô tả. Bạn có thể chọn một trong các chuyên khoa sau:"
  tool_pending: >-
    Chức năng này trên chatbot đang được hoàn thiện. Bạn có thể dùng mục tương ứng trên web bệnh nhân trong lúc chờ.
  out_of_scope_free: >-
    Mình chỉ hỗ trợ việc lịch khám: tìm lịch, xem lịch đã hẹn, xem vé, xem phí khám, hướng dẫn đổi hoặc hủy lịch và gợi ý
    chuyên khoa, nên chưa giúp được yêu cầu này.
  not_understood: >-
    Mình chưa hiểu ý bạn. Mình giúp được: tìm lịch khám, xem lịch đã hẹn, xem vé, xem phí khám, hướng dẫn đổi hoặc hủy lịch,
    và gợi ý chuyên khoa. Bạn có thể bấm một gợi ý bên dưới.
  backend_unavailable: >-
    Mình chưa lấy được dữ liệu lúc này. Bạn thử lại sau ít phút hoặc thao tác trực tiếp trên web bệnh nhân.
  ask_date: "Bạn muốn khám ngày nào{specialty}? Ví dụ: ngày mai, thứ sáu này, 20/11."
  past_date: "Ngày {date} đã qua. Bạn chọn một ngày từ hôm nay trở đi giúp mình."
  slots_found: "Các bác sĩ còn suất ngày {date}{specialty} (số suất chỉ để tham khảo, có thể thay đổi khi bạn đặt):"
  slots_none: "Ngày {date}{specialty} hiện không còn bác sĩ nhận đặt. Bạn thử ngày khác nhé."
  appointments_none: "Hồ sơ này chưa có lịch hẹn sắp tới."
  appointments_list: "Lịch hẹn sắp tới của bạn:"
  ticket_hint: "Số thứ tự khám được cấp khi tiếp tân check-in tại bệnh viện."
  payments_none: "Hồ sơ này không có khoản phí khám nào đang chờ thanh toán hay chờ hoàn."
  payments_header: "Tình hình phí khám của bạn:"
  change_manual: >-
    Để {action}, bạn mở mục Lịch của tôi trên web bệnh nhân và chọn lịch tương ứng. Chatbot sẽ hỗ trợ {action}
    bằng thẻ xác nhận khi chức năng này hoàn thiện.
  change_none: "Hồ sơ này không có lịch hẹn nào còn {action} được."
  visits_header: "Các lần khám gần đây của hồ sơ này:"
  visits_none: "Hồ sơ này chưa có lần khám nào tại bệnh viện."
  visits_hint: "Chẩn đoán, đơn thuốc và kết quả cận lâm sàng bạn xem ở mục Hồ sơ khám trên web bệnh nhân."
  visits_not_verified: >-
    Hồ sơ này chưa được xác minh danh tính nên chưa xem được lịch sử khám. Bạn mang giấy tờ tùy thân tới quầy tiếp tân
    để xác minh, sau đó xem được ở đây và ở mục Hồ sơ khám.

# Nhãn hiển thị cho trạng thái do API .NET trả về; trạng thái lạ hiển thị nguyên mã.
status_labels:
  Scheduled: đã xác nhận, chưa check-in
  CheckedIn: đã check-in
  Completed: đã khám xong
  Cancelled: đã hủy
  Absent: vắng mặt
  Rescheduled: đã đổi lịch
visit_status_labels:
  InProgress: đang khám
  WaitingCLS: đang chờ kết quả cận lâm sàng
  ReturningDoctor: đang quay lại gặp bác sĩ
  Completed: đã khám xong
  Abandoned: không hoàn tất
refund_status_labels:
  Pending: chờ duyệt
  Approved: đã duyệt, nhận tiền mặt tại quầy tiếp tân
  Settled: đã hoàn
  Rejected: không được duyệt
