[project]
name = "smart-healthcare-chatbot"
version = "0.1.0"
description = "Dịch vụ chatbot của web bệnh nhân (Giải pháp kỹ thuật §11, contract docs/api/chatbot.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "pyyaml==6.0.2",
    "aiosqlite==0.20.0",
    "httpx==0.28.1",
    "langchain==1.5.0",
    "langchain-ollama==1.1.0",
    "langgraph-checkpoint-sqlite==3.1.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
