# Bản build Vite: asset có hash trong tên được cache lâu (Cloudflare chỉ cache loại này); index.html luôn tải lại để nhận bản mới.
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
}

# Đường dẫn của React Router không có file thật: trả index.html.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
}
