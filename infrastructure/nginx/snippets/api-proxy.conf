# Chuyển /api, /auth, /me, /hubs tới Api (cùng các tuyến Vite dev server proxy ở máy dev).
# Cloudflare Tunnel kết thúc TLS rồi gửi HTTP tới nginx; IP người dùng nằm ở Cf-Connecting-Ip. Ghi đè X-Forwarded-For bằng giá
# trị đó (không nối thêm header client gửi), Api chỉ tin header khi request đến từ mạng của nginx (ForwardedHeaders:KnownNetworks).

location /api/ {
    proxy_pass http://smart_healthcare_api;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location /auth/ {
    proxy_pass http://smart_healthcare_api;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location = /me {
    proxy_pass http://smart_healthcare_api;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location /me/ {
    proxy_pass http://smart_healthcare_api;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# SignalR qua WebSockets (Giải pháp kỹ thuật §8.6): chuyển tiếp Upgrade/Connection, giữ kết nối lâu.
location /hubs/ {
    proxy_pass http://smart_healthcare_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}
