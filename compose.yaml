# Base dùng chung mọi môi trường (CTR-03). Ghép với override của từng môi trường:
#   docker compose --env-file .env.dev -f compose.yaml -f compose.dev.yaml up -d
# SQL Server và Redis không publish port ra host (OPS-01); chỉ mở trong mạng Docker nội bộ.
# Secret chỉ đến từ file .env của môi trường (không commit), không nằm trong file này.
name: smart-healthcare

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:?Thiếu MSSQL_PID (edition SQL Server)}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Thiếu MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "2560"
    volumes:
      - sqlserver-data:/var/opt/mssql
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]

  redis:
    # Chỉ làm SignalR backplane (GP v2.8 §8.6, CTR-08): không persistence, không giữ dữ liệu nghiệp vụ.
    image: redis:7.4.12-alpine
    command: ["redis-server", "--maxmemory", "96mb", "--save", "", "--appendonly", "no"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]

  api:
    image: ${API_IMAGE:?Thiếu API_IMAGE}
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:?Thiếu APP_ENVIRONMENT}
      ConnectionStrings__SmartHealthcare: ${APP_DB_CONNECTION:?Thiếu APP_DB_CONNECTION}
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Thiếu JWT_SIGNING_KEY (tối thiểu 32 byte)}
      # VNPAY sandbox (Giải pháp kỹ thuật v2.13 mục 5.4). Để trống thì Api vẫn chạy, chỉ tạo liên kết thanh toán và IPN trả lỗi cấu hình.
      Vnpay__TmnCode: ${VNPAY_TMN_CODE:-}
      Vnpay__HashSecret: ${VNPAY_HASH_SECRET:-}
      Vnpay__ReturnUrl: ${VNPAY_RETURN_URL:-}
      # Cloudflare R2 (bucket private). Điền đủ 4 biến thì tệp lưu trên R2, restart không mất.
      # Thiếu biến nào thì Api tự lưu tệp tạm trong RAM (mất khi restart container), chỉ dùng cho dev.
      CloudflareR2__AccountId: ${R2_ACCOUNT_ID:-}
      CloudflareR2__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
      CloudflareR2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
      CloudflareR2__BucketName: ${R2_BUCKET_NAME:-}
      # Chuyển tiếp chat sang service chatbot (contract chatbot §2, §3). Khóa trống thì chat báo tạm ngưng, Api vẫn chạy.
      Chatbot__BaseUrl: http://chatbot:8000
      Chatbot__InternalKey: ${CHATBOT_INTERNAL_KEY:-}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]

  worker:
    image: ${WORKER_IMAGE:?Thiếu WORKER_IMAGE}
    environment:
      DOTNET_ENVIRONMENT: ${APP_ENVIRONMENT:?Thiếu APP_ENVIRONMENT}
      ConnectionStrings__SmartHealthcare: ${APP_DB_CONNECTION:?Thiếu APP_DB_CONNECTION}
      ConnectionStrings__Redis: redis:6379
      Vnpay__TmnCode: ${VNPAY_TMN_CODE:-}
      Vnpay__HashSecret: ${VNPAY_HASH_SECRET:-}
      Vnpay__ReturnUrl: ${VNPAY_RETURN_URL:-}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]

  chatbot:
    # Chỉ chạy khi bật profile `chatbot` (COMPOSE_PROFILES=chatbot hoặc --profile chatbot), CB-09. Không publish port:
    # chỉ Api gọi vào qua mạng backend (contract chatbot §2); chatbot gọi lại API .NET trực tiếp ở api:8080.
    # Biến (đặt trong file env của môi trường, không commit): CHATBOT_IMAGE (Staging/Prod: digest), CHATBOT_INTERNAL_KEY
    # (≥ 16 ký tự, Api dùng cùng giá trị), OLLAMA_BASE_URL (ngrok static domain của Colab), OLLAMA_API_KEY, OLLAMA_MODEL.
    profiles: [chatbot]
    image: ${CHATBOT_IMAGE:-smart-healthcare/chatbot:dev}
    environment:
      CHATBOT_INTERNAL_KEY: ${CHATBOT_INTERNAL_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      DOTNET_API_BASE_URL: http://api:8080
    volumes:
      # SQLite của cuộc trò chuyện (Short-term Memory), giữ qua restart.
      - chatbot-data:/data
    depends_on:
      api:
        condition: service_started
    mem_limit: 384m
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]

networks:
  backend: {}

volumes:
  sqlserver-data:
  chatbot-data:
